[tools]
go = "1.27.1"
"go:golang.org/x/tools/gopls" = "v0.23.0"
golangci-lint = "2.14.0"
"aqua:orhun/git-cliff" = "2.13.1"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

[settings]
lockfile = true

[env]
GOMODCACHE = "{{ config_root }}/.cache/gomod"
GOCACHE = "{{ config_root }}/.cache/go-build"
GOPATH = "{{ config_root }}/.cache/go"
GOLANGCI_LINT_CACHE = "{{ config_root }}/.cache/golangci-lint"
GOPLSCACHE = "{{ config_root }}/.cache/gopls"

[tasks.dev]
description = "Run the local development daemon"
run = "go run ./cmd/rillway serve --config .local/config.json"

[tasks.build]
run = "go build -trimpath -o bin/rillway ./cmd/rillway"

[tasks.fmt]
run = "golangci-lint fmt ./..."

[tasks.lint]
run = ["golangci-lint config verify", "golangci-lint run ./..."]

[tasks.test]
run = "go test ./..."

[tasks.check]
depends = ["lint"]
run = ["mkdir -p coverage", "go test -race -shuffle=on -coverprofile=coverage/coverage.out ./..."]

[tasks."test:live"]
run = "go test -tags=live -v ./tests/live/..."

[tasks.fuzz]
run = ["go test ./internal/config -run=^$ -fuzz=FuzzDecode -fuzztime=10s", "go test ./internal/proxy -run=^$ -fuzz=Fuzz -fuzztime=10s"]

[tasks.release]
run = "sh scripts/release.sh"

[tasks."hooks:install"]
description = "Enable this repository's Git pre-commit and commit-msg hooks"
run = "sh scripts/hooks/install.sh"

[tasks."hooks:check"]
description = "Check the Git staged snapshot without changing files"
run = "bash scripts/hooks/pre-commit.sh"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from committed history"
run = "git-cliff --offline --no-exec --config cliff.toml --output CHANGELOG.md"

[tasks."changelog:preview"]
description = "Preview the changelog without changing files"
run = "git-cliff --offline --no-exec --config cliff.toml"

[tasks."changelog:check"]
description = "Validate changelog configuration against Git history"
run = "git-cliff --offline --no-exec --config cliff.toml --output /dev/null"

[tasks.notices]
description = "Refresh the third-party notices embedded in the single binary"
run = "go run scripts/release-notices.go --prepare"

[tasks."security:secrets"]
description = "Scan every reachable Git commit for secrets with redacted output"
run = "gitleaks git --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --log-opts=--all ."

[tasks."security:source"]
description = "Audit tracked files, metadata and all reachable history for private data"
run = "go run ./tools/publiccheck"

[tasks."security:vuln"]
description = "Check reachable Go vulnerabilities against the current official database"
run = ["GOOS=linux GOARCH=amd64 CGO_ENABLED=0 govulncheck ./...", "GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 govulncheck ./..."]

[tasks."ci:lint"]
description = "Validate GitHub Actions workflows"
run = "actionlint -shellcheck= .github/workflows/*.yml"

[tasks.security]
run = ["mise run security:source", "mise run security:secrets", "mise run security:vuln", "mise run ci:lint"]
