# Keep legacy commits visible; commit-msg validates new messages separately.
[changelog]
header = """
# Changelog

Generated from committed Git history with git-cliff. Regenerate before a release.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | split(pat="\n") | first }}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = "\n<!-- generated by git-cliff -->\n"

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = '^feat(\([^()]+\))?!?:', group = "<!-- 0 -->Features" },
  { message = '^fix(\([^()]+\))?!?:', group = "<!-- 1 -->Fixes" },
  { message = '^perf(\([^()]+\))?!?:', group = "<!-- 2 -->Performance" },
  { message = '^refactor(\([^()]+\))?!?:', group = "<!-- 3 -->Refactoring" },
  { message = '^docs(\([^()]+\))?!?:', group = "<!-- 4 -->Documentation" },
  { message = '^(test|build|ci|chore|style|revert)(\([^()]+\))?!?:', group = "<!-- 5 -->Maintenance" },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]
filter_commits = false
# Ignore non-release tags. Stable and prerelease SemVer tags are supported.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
sort_commits = "oldest"
