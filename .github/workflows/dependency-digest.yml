name: Dependency digest
on:
  schedule:
    # First day of each month, 09:17 Asia/Taipei.
    - cron: '17 1 1 * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
concurrency:
  group: dependency-digest
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - name: Collect available dependency versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/dependency_digest.py --repository "$GH_REPO" --output "$RUNNER_TEMP/dependency-report/REPORT.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report
          archive: true
          path: ${{ runner.temp }}/dependency-report/REPORT.md
          if-no-files-found: error
          retention-days: 7
  report:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # No checkout, repository scripts or binaries execute with issue permissions.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-report
          path: report
          digest-mismatch: error
          skip-decompress: false
      - name: Refresh the monthly digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, pathlib, subprocess
          repository = os.environ['GH_REPO']
          marker = '<!-- rillway-dependency-digest -->'
          title = 'Dependency update digest'
          body = pathlib.Path('report/REPORT.md').read_text()
          if not body.startswith(marker + '\n') or len(body.encode()) > 60000:
              raise SystemExit('Invalid digest artifact')
          issues = json.loads(subprocess.check_output([
              'gh', 'issue', 'list', '--repo', repository, '--state', 'open', '--limit', '100',
              '--search', '"Dependency update digest" in:title author:app/github-actions',
              '--json', 'number,title,body,author'], text=True))
          matches = [i for i in issues if i['title'] == title
                     and (i.get('body') or '').startswith(marker + '\n')
                     and i['author']['login'] in ('app/github-actions', 'github-actions[bot]')]
          if len(matches) > 1:
              raise SystemExit('Multiple digest issues require maintainer review')
          endpoint = f'repos/{repository}/issues'
          if matches:
              endpoint += '/' + str(int(matches[0]['number']))
          subprocess.run(['gh', 'api', '--method', 'PATCH' if matches else 'POST',
                          endpoint, '--input', '-', '--silent'],
                         input=json.dumps({'title': title, 'body': body}), text=True, check=True)
