name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and reviewed source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - run: mise run security
      - run: mise run check
      - run: mise run fuzz
      - name: Build versioned binaries
        env:
          RILLWAY_RELEASE_VERSION: ${{ github.ref_name }}
        run: mise run release
      - name: Create notes from reviewed history
        run: mise exec -- git-cliff --offline --no-exec --config cliff.toml --latest --output dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release
          archive: true
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/rillway-linux-amd64
            dist/rillway-linux-arm64
            dist/rillway-darwin-amd64
            dist/rillway-darwin-arm64
            dist/rillway-ops.zip
            dist/SHA256SUMS
            dist/MODULES.txt
            dist/RELEASE_NOTES.md
            LICENSE
            THIRD_PARTY.md
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # This job never checks out or executes repository code or binaries.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release
          path: release
          digest-mismatch: error
          skip-decompress: false
      - name: Check downloaded binaries
        working-directory: release/dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/dist/rillway-linux-amd64
            release/dist/rillway-linux-arm64
            release/dist/rillway-darwin-amd64
            release/dist/rillway-darwin-arm64
            release/dist/rillway-ops.zip
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file release/dist/RELEASE_NOTES.md \
            release/dist/rillway-linux-amd64 release/dist/rillway-linux-arm64 \
            release/dist/rillway-darwin-amd64 release/dist/rillway-darwin-arm64 \
            release/dist/SHA256SUMS release/dist/MODULES.txt release/LICENSE release/THIRD_PARTY.md \
            release/dist/rillway-ops.zip
