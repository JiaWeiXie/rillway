name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and reviewed source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - run: mise run security
      - run: mise run check
      - run: mise run fuzz
      - name: Build versioned binaries
        env:
          RILLWAY_RELEASE_VERSION: ${{ github.ref_name }}
        run: mise run release
      - name: Create notes from reviewed history
        run: mise exec -- git-cliff --offline --no-exec --config cliff.toml --latest --output dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/rillway-linux-amd64
            dist/rillway-linux-arm64
            dist/rillway-darwin-amd64
            dist/rillway-darwin-arm64
            dist/SHA256SUMS
            dist/MODULES.txt
            dist/RELEASE_NOTES.md
            LICENSE
            THIRD_PARTY.md
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # This job never checks out or executes repository code or binaries.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: release
      - name: Check downloaded binaries
        working-directory: release/dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/dist/rillway-linux-amd64
            release/dist/rillway-linux-arm64
            release/dist/rillway-darwin-amd64
            release/dist/rillway-darwin-arm64
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file release/dist/RELEASE_NOTES.md \
            release/dist/rillway-linux-amd64 release/dist/rillway-linux-arm64 \
            release/dist/rillway-darwin-amd64 release/dist/rillway-darwin-arm64 \
            release/dist/SHA256SUMS release/dist/MODULES.txt release/LICENSE release/THIRD_PARTY.md
